apis:
  - name: Bed Bath & Beyond Marketplace Seller API
    description: >-
      Seller-facing API for the Bed Bath & Beyond third-party marketplace, which
      runs as a tenant of the Mirakl Marketplace Platform at
      bedbathandbeyondus-prod.mirakl.net. Approved sellers generate a Shop API
      key from the seller portal (Profile > API Key) and use it to manage
      offers, orders, shipments and invoices. The host answers publicly on
      GET /api/version (platform 3.1306) and 401s on every other resource
      without a key. The contract is Mirakl's vendor-published Marketplace
      APIs specification, not a Bed Bath & Beyond publication, so no OpenAPI
      is stored in this repository; access is granted only after a partner
      application is reviewed.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/bed-bath-and-beyond.png
    humanURL: https://www.bedbathandbeyond.com/partner
    baseURL: https://bedbathandbeyondus-prod.mirakl.net/api
    tags:
      - Marketplace
      - Sellers
      - Orders
      - Offers
      - E-Commerce
    properties:
      - type: Documentation
        url: https://developer.mirakl.com/content/product/mmp/rest/seller/openapi3
        title: Mirakl Marketplace Platform seller API reference (vendor documentation)
      - type: Login
        url: https://bedbathandbeyondus-prod.mirakl.net/login
        title: Seller portal login (API key issued under Profile > API Key)
      - type: SignUp
        url: https://www.bedbathandbeyond.com/partner
        title: Partner application form
      - type: Support
        url: https://help.bedbathandbeyond.com/help/s/article/Overstock-Marketplace
        title: Marketplace help article
    x-ownership: >-
      Tenant of a vendor platform. The API is served by Mirakl on a Bed Bath &
      Beyond-named instance; its published OpenAPI (info.title "Mirakl
      Marketplace APIs", servers https://your-instance.mirakl.net) belongs to
      Mirakl and is deliberately not stored here.
